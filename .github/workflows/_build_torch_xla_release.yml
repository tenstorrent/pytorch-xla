name: build-torch-xla-release
on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to build (e.g., 3.11, 3.12)'
        required: true
        type: string
      torch_version:
        description: 'Torch version to build (default: 2.11.0)'
        required: false
        type: string
        default: '2.11.0'
      xla_branch:
        description: 'PyTorch-XLA branch to build (default: master)'
        required: false
        type: string
        default: 'master'
    outputs:
      artifact_name:
        description: 'Name of uploaded wheels artifact'
        value: ${{ jobs.build-wheels.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to build (e.g., 3.11, 3.12)'
        required: true
        type: string
      torch_version:
        description: 'Torch version to build (default: 2.11.0)'
        required: false
        type: string
        default: '2.11.0'
      xla_branch:
        description: 'PyTorch-XLA branch to build (default: master)'
        required: false
        type: string
        default: 'master'
jobs:
  build-wheels:
    runs-on: ['in-service', 'builder']
    timeout-minutes: 540
    env:
      ARTIFACT_NAME: install-artifact-torch-xla-release-${{ inputs.python_version }}
      GIT_VERSIONED_XLA_BUILD: 1
    container:
      image: us-central1-docker.pkg.dev/tpu-pytorch-releases/docker/development:tpu
      options: --user root
    outputs:
      artifact_name: ${{ steps.set_upload_name.outputs.artifact_name }}
    steps:
      - name: Maximize space
        shell: bash
        run: |
          # tenstorrent/tt-github-actions/.github/actions/maximize_space@main without sudo         
          echo "Disk usage before"
          echo "========================"
          df -h
          echo "Space used by toolchain"
          echo "-------------------------"
          du -h --max-depth=2 /opt || true
          echo "Space used by sw packages"
          echo "-------------------------"
          du -h --max-depth=2 /__t || true
          echo 
          # Remove sw packages
          if [ -d "/__t" ]; then
            rm -fr /__t/PyPy || true
            rm -fr /__t/node || true
            rm -fr /__t/CodeQL || true
            rm -fr /__t/Ruby || true
            rm -fr /__t/go || true
            rm -fr /__t/Python || true
          fi
          if [ -d "/opt/hostedtoolcache" ]; then
            rm -fr /opt/hostedtoolcache/PyPy || true
            rm -fr /opt/hostedtoolcache/node || true
            rm -fr /opt/hostedtoolcache/CodeQL || true
            rm -fr /opt/hostedtoolcache/Ruby || true
            rm -fr /opt/hostedtoolcache/go || true
            rm -fr /opt/google/chrome || true
            rm -fr /opt/microsoft || true
            rm -fr /opt/az || true
            rm -fr /opt/ghc || true
          fi
          echo "Disk usage after"
          echo "========================"
          df -h
      - name: "Build Torch/XLA wheel"
        shell: bash
        id: build_wheels
        run: |
          apt-get update && apt-get install -y curl git build-essential

          PY=${{ inputs.python_version }}

          # Builders carry state between jobs, so log which interpreter trees and Bazel
          # bases this job inherited and what it leaves for the next one.
          show_builder_state() {
            echo "== persistent builder state ($1) =="
            for d in /github/home/.pyenv/versions /github/home/.cache/bazel \
                     /github/home/pyenv /github/home/bazel; do
              printf '  %s: ' "$d"
              if [ -d "$d" ]; then ls -1 "$d" 2>/dev/null | tr '\n' ' '; else printf 'absent'; fi
              echo
            done
          }
          show_builder_state inherited

          # /github/home persists across jobs on a builder. Bazel bakes the absolute path
          # of the local interpreter into @local_config_python (pybind11_bazel's
          # python_configure) and declares no dependency on it, so one Python version's
          # state must never be reachable from another's build: each version gets its own
          # pyenv tree and its own Bazel output base, at stable paths, never deleted.
          # Removing either interpreter tree while a Bazel base still references it makes
          # that base unusable.

          export PYENV_ROOT="/github/home/pyenv/$PY"
          export PATH="$PYENV_ROOT/bin:$PATH"
          if [ ! -x "$PYENV_ROOT/bin/pyenv" ]; then
            rm -rf "$PYENV_ROOT"
            curl https://pyenv.run | bash
          fi
          eval "$(pyenv init -)"
          pyenv install -s $PY
          pyenv global $PY
          ln -sf $(pyenv which python$PY) /usr/local/bin/python$PY

          # Keyed on the full version, not the minor: a pyenv patch bump moves the
          # interpreter path, and must therefore get its own base.
          PY_FULL=$(basename "$(python$PY -c 'import sys; print(sys.prefix)')")
          BAZEL_OUTPUT_USER_ROOT="/github/home/bazel/$PY_FULL"
          mkdir -p "$BAZEL_OUTPUT_USER_ROOT" && touch "$BAZEL_OUTPUT_USER_ROOT"
          # Drop bases unused for two weeks so patch bumps do not pile up on the builder.
          find /github/home/bazel -mindepth 1 -maxdepth 1 -type d -mtime +14 \
            -not -path "$BAZEL_OUTPUT_USER_ROOT" -exec rm -rf {} + || true

          # WORKSPACE passes default_python_version = "system", so without this XLA's
          # python_repo.bzl infers the hermetic version from `python3 --version` — an
          # input Bazel does not track. Pin it so the requirements lock is explicit.
          export HERMETIC_PYTHON_VERSION=$PY

          # Install essential packages for Python ${{ inputs.python_version }}
          python${{ inputs.python_version }} -m pip install --upgrade pip
          python${{ inputs.python_version }} -m pip install cmake pyyaml setuptools wheel numpy typing_extensions requests six

          cd /tmp
          git clone --depth 1 --recursive --branch v${{ inputs.torch_version }} https://github.com/pytorch/pytorch.git
          cd pytorch/
          git clone --recursive --branch ${{ inputs.xla_branch || 'master' }} https://github.com/tenstorrent/pytorch-xla.git xla

          (
            # Build PyTorch
            # From https://docs.pytorch.org/FBGEMM/fbgemm/development/BuildInstructions.html, section "Build Issues with GCC 12+"
            export CFLAGS+="-w -Wno-error=maybe-uninitialized -Wno-error=uninitialized -Wno-error=restrict"
            export CXXFLAGS+="-w -Wno-error=maybe-uninitialized -Wno-error=uninitialized -Wno-error=restrict"
            # copy pre-built wheels from cache
            MAX_JOBS=8 BAZEL_JOBS=8 python${{ inputs.python_version }} setup.py bdist_wheel
            MAX_JOBS=8 BAZEL_JOBS=8 python${{ inputs.python_version }} setup.py develop

            rm -rf .git/
          )

          # Build PyTorch/XLA
          cd xla/
          # .bazelrc try-imports this; it is the only way to reach a startup option,
          # since setup.py owns the bazel command line.
          echo "startup --output_user_root=$BAZEL_OUTPUT_USER_ROOT" > .bazelrc.user
          MAX_JOBS=8 BAZEL_JOBS=8 python$PY setup.py bdist_wheel

          # Collect wheels
          mkdir -p /dist
          cp dist/*.whl /dist/

          show_builder_state "left behind"

      - name: "Upload Wheels Artifact"
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /dist/*.whl
      
      - name: Set artifact name output
        id: set_upload_name
        run: echo "artifact_name=${{ env.ARTIFACT_NAME }}" >> $GITHUB_OUTPUT
